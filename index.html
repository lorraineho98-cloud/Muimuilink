<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Gor gor love mui mui or not? 💌</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff5c8a;
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 10px 30px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #ff5c8a;
      color: white;
    }

    #no {
      background-color: #ccc;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Gor gor love mui mui or not?💗</h1>
    <button id="yes">yes</button>
    <button id="no">no</button>
  </div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff9eb5,#ffd6e8);
        font-family:Segoe UI;
        text-align:center;
      ">
        <div>
          <h1 style="color:white;font-size:48px;">yeah I know u love mui mui  der nohh 💖</h1>
          <p style="color:white;font-size:24px;">xixixixixi。</p>
        </div>
      </div>
    `;
  });
</script>

</body>
</html>
