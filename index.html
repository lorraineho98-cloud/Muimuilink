<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品价格监控看板</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 16px; color: #111; }
    .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
    .info h2 { font-size: 16px; margin: 0 0 6px 0; }
    .time { font-size: 12px; color: #888; }
    .prices { text-align: right; }
    .current { font-size: 20px; font-weight: bold; color: #e53935; }
    .old { font-size: 13px; color: #999; text-decoration: line-through; margin-left: 6px; }
    .badge { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: #ffebee; color: #c62828; }
    .badge.flat { background: #f0f0f0; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 实时商品价格对比监控</h1>
    <div id="list">正在加载最新比价数据...</div>
  </div>

  <script>
    fetch('./prices.json?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error('暂无数据');
        return res.json();
      })
      .then(data => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        for (const [name, item] of Object.entries(data)) {
          const isDrop = item.drop_percent > 0;
          list.innerHTML += `
            <div class="card">
              <div class="info">
                <h2>${name}</h2>
                <div class="time">更新：${item.update_time}</div>
              </div>
              <div class="prices">
                <div>
                  <span class="current">RM${item.price.toFixed(2)}</span>
                  <span class="old">RM${item.old_price.toFixed(2)}</span>
                </div>
                <div class="badge ${isDrop ? '' : 'flat'}">
                  ${isDrop ? `🔥 直降 ${item.drop_percent}% (省 RM${item.drop_amount.toFixed(2)})` : '价格平稳'}
                </div>
              </div>
            </div>
          `;
        }
      })
      .catch(() => {
        document.getElementById('list').innerHTML = '<p>暂无价格记录，请先在 GitHub Actions 运行一次监控脚本。</p>';
      });
  </script>
</body>
</html>
