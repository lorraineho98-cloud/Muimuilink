name: Price Monitor CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许你随时在网页上手动点击按钮运行
  schedule:
    - cron: '0 0,12 * * *'  # 每天马来西亚时间中午 12:00 和午夜 12:00 自动定时运行

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run price monitor script
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          python monitor.py

      - name: Commit and push changes if prices updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Auto-update prices.json by GitHub Actions" || echo "No changes to commit"
          git push
